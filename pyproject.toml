[tool.poetry]
name = "e7shop-script"
version = "0.1.0"
description = "A Script from RimuruTemp Guild to Refresh Buy the Tabern Shop for Mystic Medals and Bookmarks"
authors = ["Blightningstar <jasonzatre@hotmail.com>"]
readme = "README.md"

[tool.poetry.dependencies]
python = ">=3.11,<3.13"
opencv-python = "^4.9.0.80"
uiautomator2 = "^3.0.4"
easyocr = "^1.7.1"

[tool.poetry.group.dev.dependencies]
icecream = "^2.1.3"
pre-commit = "^3.7.0"
pyinstaller = "^6.5.0"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

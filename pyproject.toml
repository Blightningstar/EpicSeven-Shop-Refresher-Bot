[tool.poetry]
name = "e7shop-script"
version = "0.1.0"
description = "A Script from RimuruTemp Guild to Refresh Buy the Tabern Shop for Mystic Medals and Bookmarks"
authors = ["Blightning97 <jasonzatre@hotmail.com>"]
package-mode = false

[tool.poetry.dependencies]
python = "^3.11"
pywin32 = { version = "^306", platform = "win32", markers = "platform_system == 'Windows'" }
keyboard = "^0.13.5"
PyAutoGUI = "^0.9.54"
opencv-python = "^4.9.0.80"

[tool.poetry.group.dev.dependencies]
icecream = "^2.1.3"
pre-commit = "^3.6.2"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"
